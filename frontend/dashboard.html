<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase de lista — Asistencia QR</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <main class="dashboard-page">
    <header>
      <h1>Pase de lista de hoy</h1>
      <div>
        <a href="roster.html" class="secondary-link">Lista de alumnos</a>
        <a href="stats.html" class="secondary-link">Estadísticas</a>
        <button id="logout-btn" class="secondary">Cerrar sesión</button>
      </div>
    </header>

    <section class="card" id="start-panel">
      <h2>Clase de hoy</h2>
      <p class="hint">Todavía no has iniciado el pase de lista de hoy.</p>
      <button id="start-btn">Iniciar clase de hoy</button>
    </section>

    <section class="dashboard-grid hidden" id="active-panel">
      <div class="card qr-card">
        <h2>Escanea para pasar lista</h2>
        <div id="qrcode"></div>
        <p class="countdown">Se actualiza en <span id="countdown">--</span>s</p>
        <button id="finish-btn">Finalizar clase</button>
      </div>

      <div class="card">
        <h2>Presentes: <span id="checked-count">0</span> / <span id="total-count">0</span></h2>
        <table id="status-table">
          <thead>
            <tr><th>Matrícula</th><th>Nombre</th><th>Hora</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card hidden" id="finished-panel">
      <h2>Clase de hoy finalizada</h2>
      <p class="hint">
        Se registraron <span id="finished-count">0</span> asistencias.
        El QR ya no acepta nuevos registros.
      </p>
      <button id="reopen-btn" class="secondary">Reabrir clase</button>
    </section>

    <section class="danger-zone hidden" id="danger-zone">
      <button id="cancel-btn" class="danger">Cancelar clase de hoy (borra lo registrado)</button>
    </section>
  </main>
  <script src="js/dashboard.js"></script>
</body>
</html>
